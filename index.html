:root{--sky1:#e8832a;--sky2:#ffe2b0;--card:#fff9ec;--ink:#3b2314;--mut:#7a5a45;--pri:#f2902f;--pri2:#f4b942;--sec:#fbe8c8;--good:#5b8c3a;--bad:#b23a48;--line:#ecd5ad}

<div id="top"></div>
<main><div id="nav"></div><div id="screen"></div><div id="foot"></div></main>

<script src="config.js"></script>
<script>
const $=i=>document.getElementById(i),T=['Start','1924','Map room','Balloon lab','Street test','Finale'];
let S={pg:0,stars:0,fx:true,mo:true,cr:new Set(),tl:[],mp:0,gas:'helium',size:6,mass:4,shape:'star',color:'#ff6b6b',found:new Set(),won:{},notes:[],g:null,view:'home',depth:'8',tq:{},q:{},pl:0,who:'',lvSet:false,title:'',backFn:''};
const pName=()=>S.who||'Explorer';
function playFX(k='tap'){if(!S.fx)return;try{S.c=S.c||new(window.AudioContext||window.webkitAudioContext)();S.c.resume();let t=S.c.currentTime,n=k==='win'?[392,523,659,784]:k==='wrong'?[220,165]:[440,660];n.forEach((f,i)=>{let o=S.c.createOscillator(),g=S.c.createGain(),a=t+i*.09;o.frequency.value=f;g.gain.setValueAtTime(.001,a);g.gain.exponentialRampToValueAtTime(.06,a+.015);g.gain.exponentialRampToValueAtTime(.001,a+.15);o.connect(g);g.connect(S.c.destination);o.start(a);o.stop(a+.16)})}catch(e){}}
function togFX(){S.fx=!S.fx;if(S.fx)playFX('win')}
function togMo(){S.mo=!S.mo;document.body.classList.toggle('nomo',!S.mo)}
function confetti(){if(!S.mo)return;for(let i=0;i<40;i++){let d=document.createElement('i');d.className='conf';d.style.cssText=`left:${Math.random()*100}vw;background:${['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#b388ff'][i%5]};animation-delay:${Math.random()*.5}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
const DISC={cr:'In 1924 the parade had zoo animals, bands and costumed store workers. Giant balloons came later.',tl:'Timeline: 1924 first parade → 1927 air-filled giant characters → 1928 helium → 1934 Mickey Mouse.',map:'The 1924 parade started in Harlem at 145th Street and Convent Avenue and finished at Herald Square.',lab:'A balloon rises when its lift beats the weight of its gas, skin and attachments.',st:'Wind pushes huge balloons sideways, so handlers and organizers watch it closely.',sp:'On parade morning you can spot handlers, bands, floats and tall buildings that act like walls.',arc:'A map shows geography. You need more evidence, like ads or eyewitness accounts, to prove a route.'};
const K=()=>'parade:'+pName();
function save(){try{localStorage.setItem(K(),JSON.stringify({won:S.won,notes:S.notes,tq:S.tq}))}catch(e){}sync()}
function cnt(){if(S.who)chrome()}
function loadP(){S.won={};S.notes=[];S.tq={};try{let d=JSON.parse(localStorage.getItem(K())||'null');if(d){S.won=d.won||{};S.notes=d.notes||[];S.tq=d.tq||{}}}catch(e){}S.cr=new Set();S.tl=[];S.mp=0;S.found=new Set();cnt();sync();home()}
function award(k){if(S.won[k])return;S.won[k]=DISC[k]||QT[k]||1;save();cnt();confetti();playFX('win')}
function saveNote(t){if(!S.notes.includes(t)){S.notes.push(t);save();cnt()}playFX('win')}
function notebook(){stopG();setView('nb','My notebook','');let all=[...Object.entries(S.won).map(([k,v])=>v===1?(DISC[k]||k):v),...S.notes];$('screen').innerHTML=`<span class="tag">${pName()}’s notebook</span><h1>Explorer notebook</h1><div class="panel"><h2>Discoveries &amp; saved facts</h2>${all.length?all.map(t=>`<p>📌 ${t}</p>`).join(''):'<p>Nothing yet. Finish mission activities and save facts from the evidence crates!</p>'}<p class="mut">Saved on this device for ${pName()} when the browser allows it.</p></div><button class="big" onclick="home()">Back to adventure</button>`;scrollTo(0,0)}
const M='https://www.macysinc.com/newsroom/news/news-details/2016/A-Historic-Procession-The-World-Famous-Macys-Thanksgiving-Day-Parade-Celebrates-90-Years-as-the-Official-Start-to-the-Holiday-Season-11-01-2016/default.aspx',LOC=['Library of Congress — parade history','https://guides.loc.gov/this-month-in-business-history/november/macys-thanksgiving-parade'],MC2=['Museum of the City of New York — parade map and history','https://mappingnyc.mcny.org/o/mcny/s/a57f7b47-af99-46d8-beca-10f057bc969b'];
const SRC={1:[LOC,['Macy’s official 2016 retrospective',M]],2:[MC2,['NYPL Digital Collections','https://digitalcollections.nypl.org/']],3:[['Macy’s official 2016 retrospective (helium date)',M]],4:[LOC],5:[LOC,MC2]};
function src(p){return SRC[p]?`<details class="panel"><summary><b>📚 Sources for this mission</b></summary>${SRC[p].map(s=>`<p><a href="${s[1]}" target="_blank" rel="noopener">${s[0]} ↗</a></p>`).join('')}<p class="mut">Links need internet. Wikipedia is not used as a source.</p></details>`:''}
function fb(id,t,ok=true){let e=$(id);e.textContent=t;e.className='fb'+(ok?'':' no');playFX(ok?'tap':'wrong')}
function stopG(){if(S.g){S.g.on=false;cancelAnimationFrame(S.g.raf)}}
function go(n){if(!n){playMenu();return}stopG();S.pg=n;setView('parade',T[n],'go(0)');render();scrollTo(0,0)}
const next=n=>`<button class="big" onclick="go(${n})">Continue expedition →</button>`;
/* balloon art */
function bal(sh,c,r){let b=sh==='star'?`<polygon points="${Array.from({length:10},(_,i)=>{let a=i*Math.PI/5-Math.PI/2,d=i%2?r*.5:r;return Math.cos(a)*d+','+Math.sin(a)*d}).join(' ')}" fill="${c}"/>`:sh==='cat'?`<path d="M${-r*.8} ${-r*.4}L${-r*.75} ${-r*1.3}L${-r*.2} ${-r*.85}L${r*.2} ${-r*.85}L${r*.75} ${-r*1.3}L${r*.8} ${-r*.4}Z" fill="${c}"/><circle r="${r}" fill="${c}"/>`:`<ellipse rx="${r*.6}" ry="${r*1.15}" fill="${c}"/><path d="M${-r*.5} ${r*.6}L${-r*.95} ${r*1.2}L${-r*.2} ${r*.95}ZM${r*.5} ${r*.6}L${r*.95} ${r*1.2}L${r*.2} ${r*.95}Z" fill="#ffd166"/>`;
return `<path d="M${-r*.4} ${r*.7}L-8 ${r+46}M${r*.4} ${r*.7}L8 ${r+46}" stroke="#fff" stroke-width="2.5" opacity=".9"/>${b.replace('/>',' stroke="#fff" stroke-width="4" stroke-linejoin="round"/>')}<ellipse cx="${-r*.3}" cy="${-r*.1}" rx="${r*.1}" ry="${r*.15}" fill="#1d2b4d"/><ellipse cx="${r*.3}" cy="${-r*.1}" rx="${r*.1}" ry="${r*.15}" fill="#1d2b4d"/><path d="M${-r*.25} ${r*.2}Q0 ${r*.5} ${r*.25} ${r*.2}" fill="none" stroke="#1d2b4d" stroke-width="3" stroke-linecap="round"/><circle cx="${-r*.45}" cy="${r*.12}" r="${r*.09}" fill="#fff" opacity=".4"/>`}
function sky(old){let col=old?['#8a7a6a','#b98c6a','#7d8a96','#d2a77c']:['#5c7a9e','#d9735b','#6f8fb0','#e8b36b'],cr=['#e63946','#ffd166','#06d6a0','#4cc9f0'];
return `<svg class="art" viewBox="0 0 800 380" role="img" aria-label="Illustration of a parade in Manhattan"><defs><linearGradient id="g${old?1:0}" x2="0" y2="1"><stop stop-color="${old?'#e3c590':'#6fc3ff'}"/><stop offset="1" stop-color="${old?'#fbe6bd':'#fff0c8'}"/></linearGradient></defs><rect width="800" height="380" fill="url(#g${old?1:0})"/><circle cx="700" cy="60" r="38" fill="#fff0a8"/>${Array.from({length:14},(_,i)=>{let x=i*61,h=95+(i*73)%150;return `<rect x="${x}" y="${270-h}" width="56" height="${h}" rx="4" fill="${col[i%4]}"/>`+Array.from({length:Math.floor(h/24)},(_,j)=>`<path d="M${x+9} ${284-h+j*24}h10m10 0h10m10 0h6" stroke="#ffe9a8" stroke-width="8" stroke-linecap="round"/>`).join('')}).join('')}<rect y="270" width="800" height="110" fill="#43536b"/><path d="M0 330H800" stroke="#ffe9a8" stroke-width="5" stroke-dasharray="30 22"/>${Array.from({length:30},(_,i)=>`<g transform="translate(${i*28+8} ${i%2?292:362})"><circle cy="-16" r="8" fill="#f0c19b"/><rect x="-8" y="-8" width="16" height="22" rx="8" fill="${cr[i%4]}"/></g>`).join('')}${old?`<g transform="translate(170 292)" fill="#8a6a55"><ellipse cy="-22" rx="58" ry="32"/><circle cx="50" cy="-32" r="25"/><path d="M66 -26q12 62 30 32" fill="none" stroke="#8a6a55" stroke-width="16"/><path d="M-32 0v38m46-38v38" stroke="#8a6a55" stroke-width="16"/></g><rect x="440" y="280" width="150" height="42" rx="8" fill="#c0533f"/><circle cx="462" cy="324" r="14"/><circle cx="568" cy="324" r="14"/><text x="515" y="308" fill="#fff" text-anchor="middle" font-size="19" font-weight="700">MACY’S</text>`:`<g transform="translate(190 130)"><g class="fl">${bal('star','#ff6b6b',55)}</g></g><g transform="translate(400 100)"><g class="fl fl2">${bal('cat','#4cc9f0',60)}</g></g><g transform="translate(620 140)"><g class="fl fl3">${bal('rocket','#b388ff',50)}</g></g>`}</svg>`}
/* pages */
function render(){let p=S.pg,h='';$('nav').innerHTML='';
if(p==0)h=`<span class="tag">Thomas, Wyatt &amp; Cassandra’s trip to New York City</span><h1>Big balloons.<br>Big city.</h1><div class="lay"><div>${sky()}</div><div class="panel"><h2>Your parade starts here, ${pName()}!</h2><p>Be a parade historian, city navigator and balloon engineer. Can you build a floating character and guide it through Manhattan?</p><p class="mut">Five missions • about 15 minutes • no timer pressure • fill your 📓 explorer notebook with real discoveries.</p><button class="big" onclick="go(1)">Enter the time machine →</button></div></div>`;

if(p==3)h=`<span class="tag">Mission 03 · Engineering workshop</span><h1>Make it float.</h1><div class="lay"><div><svg class="art" viewBox="0 0 450 320"><rect width="450" height="320" fill="#a8dcf5"/><path d="M0 280H450V320H0Z" fill="#6bbf6b"/><g id="bl" style="transform:translate(225px,110px)"></g><text id="ll" x="14" y="30" font-size="20" font-weight="700" fill="#1d2b4d"></text></svg><p id="lm" class="fb"></p></div><div class="panel"><p>Helium is less dense than air. A balloon rises when the lift from the air it pushes aside is greater than the weight of its gas, skin and attachments.</p><label>Gas <select id="gas" onchange="S.gas=this.value;lab()"><option value="helium">Helium</option><option value="air">Ordinary air</option></select></label><label>Balloon volume: <span id="sv"></span><input type="range" min="2" max="12" value="${S.size}" oninput="S.size=+this.value;lab()"></label><label>Skin &amp; attachments weight: <span id="mv"></span><input type="range" min="1" max="10" value="${S.mass}" oninput="S.mass=+this.value;lab()"></label><div class="row"><button class="s" onclick="S.shape='star';lab()">⭐ Star</button><button class="s" onclick="S.shape='cat';lab()">🐱 Cat</button><button class="s" onclick="S.shape='rocket';lab()">🚀 Rocket</button><input aria-label="Balloon color" type="color" value="${S.color}" oninput="S.color=this.value;lab()"></div><p class="mut">Toy model with simplified units, not real engineering specifications.</p></div></div><div class="panel"><h2>Three experiments</h2><p>1. Try ordinary air, then helium. 2. Make the balloon sink by adding weight. 3. Find a design with a lift margin of 1–3 units.</p><button onclick="chk()">Test my design</button><p id="tm" class="fb"></p><button class="big" onclick="go(4)">Take my balloon to the street →</button></div>`;

if(p==5){let L=['Balloon handlers','Sixth Avenue sign','Marching band','Decorated float','Tall buildings','A balloon changing height'];h=`<span class="tag">Mission 05 · Parade morning</span><h1>See the city differently.</h1>${sky()}<div class="panel"><h2>Tomorrow’s field mission</h2><p>Each time you spot one, tap it!</p><div class="grid">${L.map((x,i)=>`<button class="crate ${S.found.has(i)?'on':''}" style="height:auto;font-size:18px;padding:14px" onclick="spot(${i})">${S.found.has(i)?'✓ ':''}${x}</button>`).join('')}</div><h2>Explain it to someone</h2><p>Why can a helium balloon rise? How was the parade different in 1924? Why might a balloon stay home on a windy day?</p><div id="ct"></div><button onclick="guide()">Open field guide &amp; sources</button> <button class="s" onclick="go(0)">Play again</button></div>`}

function drawG(){let g=S.g,x=g?g.x:50,w=g?g.w:0;$('sb').setAttribute('transform',`translate(${62+x*2.76} 120) rotate(${w*8})`);$('sb').innerHTML=bal(S.shape,S.color,42)+`<g transform="translate(0 ${42+75})"><circle cx="-14" r="8" fill="#f0c19b"/><circle cx="14" r="8" fill="#f0c19b"/><rect x="-22" y="8" width="16" height="22" rx="6" fill="#06d6a0"/><rect x="6" y="8" width="16" height="22" rx="6" fill="#ffd166"/></g>`}

function tick(n){let g=S.g;if(!g||!g.on)return;let dt=Math.min(.05,(n-g.last)/1000);g.last=n;g.t+=dt;if(g.t>=g.ng){g.ng=g.t+2+Math.random()*1.5;g.w=[-1,-.6,0,.6,1][Math.random()*5|0]}
g.x+=(g.w*13+g.in*36)*dt;g.p+=dt*3.2;
if(g.x<10||g.x>90){g.hp--;g.x=g.x<10?26:74;playFX('wrong');let e=$('sw');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
$('pb').style.width=Math.min(100,g.p)+'%';$('hp').textContent='❤️'.repeat(Math.max(0,g.hp))||'💔';$('wn').textContent='Wind: '+(g.w<0?'← ':g.w>0?'→ ':'calm ')+(g.w?Math.abs(g.w)>.7?'strong gust':'breeze':'');drawG();
if(g.hp<=0){g.on=false;return fb('sm','The wind won this round. Pull earlier and try again!',false)}
if(g.p>=100){g.on=false;fb('sm','Herald Square reached! Your crew completed the route! 🎉');return award('st',g.hp)}
g.raf=requestAnimationFrame(tick)}

const historyData=[{"title": "Roosevelt Island: A Place of Many Names", "emoji": "🏝️", "story": "The island was part of Lenape homelands before European colonization; it was later known as Blackwell's Island. In the 1800s it became a place where New York City built institutions including a penitentiary, almshouse, and hospitals. Journalist Nellie Bly's 1887 investigation exposed mistreatment at the Women's Lunatic Asylum. The island was renamed Welfare Island in 1921 and Roosevelt Island in 1973. The tram began operating in 1976. Today it is a residential neighborhood, with parks and landmarks that preserve parts of its complicated past.", "idea": "The island's history asks: Who decides how land is used, and whose experiences are remembered?", "questions": [["What was Roosevelt Island once called?", ["Blackwell's Island", "Liberty Island", "Governors Island"], 0, "Blackwell's Island was an earlier name. It later became Welfare Island and then Roosevelt Island."], ["Why did Nellie Bly's reporting matter?", ["It revealed conditions inside an asylum", "It built the tram", "It renamed the East River"], 0, "Her investigative reporting helped expose mistreatment and sparked calls for reform."], ["Which came first?", ["The island's hospitals and prison", "The 1976 tram", "The Four Freedoms memorial"], 0, "Public institutions existed on the island long before the modern tram."]], "missions": ["Look for a historic building or plaque. What does it reveal about the island's earlier uses?", "Compare the tram and the old institutional buildings. What does that tell you about how a city changes?"]}, {"title": "Thanksgiving: How a Holiday Changed", "emoji": "🌽", "story": "Indigenous peoples across North America held harvest and gratitude traditions long before Europeans arrived. In 1621, Wampanoag people and English colonists shared a harvest gathering at Plymouth, but the familiar Thanksgiving story can overlook Wampanoag perspectives and the devastating consequences of colonization. Thanksgiving did not become an annual national holiday immediately. In 1863, during the Civil War, President Abraham Lincoln proclaimed a national day of thanksgiving. In 1941, Congress passed legislation setting the federal holiday on the fourth Thursday of November, and President Franklin D. Roosevelt signed it into law.", "idea": "History is richer when we ask whose voices were included and whose were left out.", "questions": [["Which president proclaimed a national Thanksgiving in 1863?", ["Abraham Lincoln", "George Washington", "Franklin D. Roosevelt"], 0, "Lincoln's proclamation came during the Civil War."], ["Did harvest and gratitude traditions begin with the English colonists?", ["No, Indigenous peoples already had traditions", "Yes, in 1621", "Only after 1941"], 0, "Indigenous communities had long-standing harvest and gratitude practices."], ["Why should we study more than one account of 1621?", ["To understand Indigenous and colonial perspectives", "Because history is a contest", "To avoid asking questions"], 0, "A fuller history considers different sources, experiences, and later events."]], "missions": ["Ask each family member what gratitude means to them.", "How might a Wampanoag account of the 1621 gathering differ from a familiar schoolbook story?"]}, {"title": "The Macy's Parade: Balloons, People and Invention", "emoji": "🎈", "story": "The Macy's Thanksgiving Day Parade began in 1924 with a festive procession of employees and performers. Large character balloons debuted in 1927, following earlier parades that included live animals. The parade was suspended in 1942, 1943 and 1944 during World War II. Today it is a huge collaborative production involving performers, artists, engineers, balloon handlers and city workers. The giant parade balloons are typically filled with helium, which is less dense than the surrounding air, but wind can still make them difficult to steer.", "idea": "A parade is also a lesson in design, physics and cooperation.", "questions": [["In what year did the parade begin?", ["1924", "1776", "2001"], 0, "Macy's began the parade in 1924."], ["Why did the parade stop from 1942 through 1944?", ["World War II", "A subway strike", "The invention of television"], 0, "The parade paused during World War II."], ["What makes a helium balloon rise?", ["Buoyancy: helium is less dense than air", "The ropes push it upward", "The sun pulls it"], 0, "The surrounding air provides a buoyant force on the helium-filled balloon."]], "missions": ["Observe how many people work together to guide one balloon.", "Imagine designing a balloon for a windy city street. What shape and safety rules would you choose?"]}, {"title": "Sixth Avenue and Midtown: A City That Reinvents Itself", "emoji": "🏙️", "story": "Sixth Avenue runs through Midtown Manhattan and is officially also called Avenue of the Americas, a name adopted in 1945. Near Central Park, the avenue passes a landscape shaped by transit, business, entertainment and changing architecture. Rockefeller Center was developed during the Great Depression, and Radio City Music Hall opened in 1932. Manhattan's street grid, adopted in the Commissioners' Plan of 1811, helped organize much of the city's northward growth, although Broadway and some older roads cut across it.", "idea": "Streets are not just routes: they are evidence of decisions made over centuries.", "questions": [["What is another name for Sixth Avenue?", ["Avenue of the Americas", "Fifth Street", "Broadway"], 0, "The avenue received its additional name in 1945."], ["What opened in 1932 near Rockefeller Center?", ["Radio City Music Hall", "The Roosevelt Island Tram", "The Brooklyn Bridge"], 0, "Radio City Music Hall opened in 1932."], ["Why do many Manhattan streets form a grid?", ["An 1811 plan helped lay out streets", "A parade created them", "Every street follows a river"], 0, "The Commissioners' Plan of 1811 shaped much of Manhattan's numbered grid."]], "missions": ["Look at two nearby street signs. How do their numbers change as you travel south?", "Find an older-looking building and a newer one. What materials or styles differ?"]}, {"title": "Central Park: Designed Nature and Hidden Histories", "emoji": "🌳", "story": "Central Park may look like untouched nature, but it was deliberately designed. In 1858, Frederick Law Olmsted and Calvert Vaux won a competition with their Greensward Plan. Workers reshaped land, moved earth and planted trees to create a public landscape. Before the park, this area included homes, businesses and communities, including Seneca Village, a predominantly African American community founded in 1825. Residents were displaced as the city acquired land for the park. Today, the park is both a beloved public space and a place to remember people whose homes once stood there.", "idea": "Who benefits from a public project, and who bears its costs?", "questions": [["Was Central Park designed or left entirely wild?", ["It was deliberately designed", "It formed overnight", "It is a natural island"], 0, "Olmsted and Vaux's Greensward Plan shaped the park's design."], ["What was Seneca Village?", ["A community displaced for the park", "A parade balloon", "A subway station"], 0, "Seneca Village was a predominantly Black community with both property owners and renters; residents were displaced as land was taken for Central Park."], ["What can studying Central Park teach us?", ["Public projects can have benefits and costs", "Cities never change", "Parks have no history"], 0, "The park provides recreation, but its creation also displaced people."]], "missions": ["Look for a landscape feature that seems natural. Could people have designed it?", "How could a city build public parks while respecting existing residents?"]}];

var SCI=[{"e": "🎈", "t": "What makes things float?", "b": "Air pushes up on every balloon. This upward push is called buoyancy. A balloon floats when the air it pushes out of the way weighs more than the balloon and the gas inside it.", "m": "This is Archimedes’ principle: the upward force on an object equals the weight of the air (or water) it pushes aside.", "a": "For a balloon in air, buoyant force = air density × volume × gravity. A bigger balloon pushes aside more air, so it gets a bigger upward force."}, {"e": "🧪", "t": "Why helium?", "b": "Helium is much lighter than air. A balloon full of helium weighs less than the same amount of air, so the air pushes it up.", "m": "Helium is about one-seventh as dense as air. Hydrogen is even lighter, but it can catch fire, so helium is the safe choice for public events.", "a": "At room temperature, air is about 1.2 kg per cubic meter and helium about 0.17 kg per cubic meter. The difference, roughly 1 kg of lift per cubic meter, is a handy rule of thumb."}, {"e": "⬆️", "t": "The forces on a balloon", "b": "Four pushes and pulls matter: lift (up), weight (down), wind (sideways) and the handlers’ ropes (pulling back). When the up and down forces balance, the balloon hovers.", "m": "Net force is what is left after you compare forces. If lift is bigger than weight, the net force is up and the balloon rises. If weight is bigger, it sinks.", "a": "Newton’s first law: balanced forces mean no change in motion. A tethered balloon stays put because lift, weight, wind and rope tension add up to zero."}, {"e": "⚖️", "t": "Weight, mass and balance", "b": "Everything on a balloon adds weight: the skin, the ropes, even the paint. The lift has to beat all of it.", "m": "Mass is how much stuff something has. Weight is how hard gravity pulls on that mass. Balance matters too: hanging weight low and spreading the ropes keeps a balloon steadier.", "a": "A hanging balloon is stable when its center of gravity sits below its center of buoyancy, so it swings back upright like a pendulum. Doubling a balloon’s width gives 8 times the volume but only about 4 times the skin, so big balloons lift much more than their skin weighs."}, {"e": "🌬️", "t": "How wind pushes balloons", "b": "A giant balloon is like a huge sail. Wind pushes it sideways, and gusts can push even harder.", "m": "The sideways push from wind is called drag. A bigger balloon catches more wind, and faster wind pushes harder.", "a": "Drag grows with the square of the speed (NASA Glenn): if the wind doubles from 10 to 20 mph, the push is about 4 times as strong. Tall buildings can funnel and gust the wind along avenues, and wind is usually stronger higher above the ground."}, {"e": "🪢", "t": "Handlers keep it steady", "b": "Handlers hold ropes to steer the balloon and keep it low. Each handler pulls a small share.", "m": "A team spreads the work. When a balloon has a lot of net lift, more handlers are needed so each person pulls a manageable amount.", "a": "If a balloon has 400 newtons of net upward force held by 20 handlers, each handler supplies about 20 newtons of pull, before adding the extra push of any gusts."}, {"e": "🚦", "t": "Why balloons sometimes stay home", "b": "If the wind is too strong, balloons can be unsafe, so they may be kept on the ground.", "m": "City rules ground the balloons if sustained wind is above 23 mph or gusts are above 34 mph. Police watch wind gauges along the route (PBS NewsHour).", "a": "Wind blowing a balloon into a lamp post near Central Park in 1997 led to the rules. News reports before the 2026 parade mentioned a possible nor’easter, so wind could matter again."}, {"e": "🌡️", "t": "Cold weather", "b": "On a chilly morning, gas shrinks a little, so balloons can look softer.", "m": "Gases take up less space when they cool, which is why balloons may look less full in the cold.", "a": "Lift depends on the density difference between the surrounding air and the gas inside, so temperature changes can shift how much lift a balloon has."}];

$('screen').innerHTML='<h1>📜 Thanksgiving proclamations</h1><p class="lead">Two presidents, 100 years apart, in their own words.</p>'
+'<div class="panel"><h2>Abraham Lincoln · October 3, 1863</h2><p class="mut">Issued during the Civil War, about three months after the Battle of Gettysburg. It asked Americans to observe the last Thursday of November as a day of thanksgiving. Some words to look up: <i>bounties</i>, <i>insensible</i>, <i>heretofore</i>, <i>sojourning</i>, <i>interposition</i>.</p>'
+'<details open><summary><b>Read the full text</b></summary>'+"<p style=\"font-family:Georgia,serif;line-height:1.6\">The year that is drawing toward its close, has been filled with the blessings of fruitful fields and healthful skies. To these bounties, which are so constantly enjoyed that we are prone to forget the source from which they come, others have been added, which are of so extraordinary a nature that they can not fail to penetrate and soften even the heart which is habitually insensible to the ever-watchful providence of Almighty God. In the midst of a civil war of unequaled magnitude and severity, which has sometimes seemed to foreign States to invite and to provoke their aggression, peace has been preserved with all nations, order has been maintained, the laws have been respected and obeyed, and harmony has prevailed everywhere, except in the theater of military conflict; while that theatre has been greatly contracted by the advancing armies and navies of the Union. Needful diversions of wealth and of strength from the fields of peaceful industry to the national defense have not arrested the plow, the shuttle, or the ship; the ax has enlarged the borders of our settlements, and the mines, as well of iron and coal as of the precious metals, have yielded even more abundantly than heretofore. Population has steadily increased, notwithstanding the waste that has been made in the camp, the siege, and the battlefield, and the country, rejoicing in the consciousness of augmented strength and vigor, is permitted to expect continuance of years with large increase of freedom.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">No human counsel hath devised nor hath any mortal hand worked out these great things. They are the gracious gifts of the Most High God, who, while dealing with us in anger for our sins, hath nevertheless remembered mercy.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">It has seemed to me fit and proper that they should be solemnly, reverently, and gratefully acknowledged as with one heart and one voice by the whole American People. I do therefore invite my fellow-citizens in every part of the United States, and also those who are at sea and those who are sojourning in foreign lands, to set apart and observe the last Thursday of November next as a day of Thanksgiving and Praise to our beneficent Father who dwelleth in the Heavens. And I recommend to them that while offering up the ascriptions justly due to Him for such singular deliverances and blessings, they do also, with humble penitence for our national perverseness and disobedience, commend to His tender care all those who have become widows, orphans, mourners, or sufferers in the lamentable civil strife in which we are unavoidably engaged, and fervently implore the interposition of the Almighty Hand to heal the wounds of the nation and to restore it as soon as may be consistent with the Divine purposes, to the full enjoyment of peace, harmony, tranquillity, and Union.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">In testimony whereof, I have hereunto set my hand and caused the Seal of the United States to be affixed.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">Done at the City of Washington, this 3d day of October, A. D. 1863, and of the Independence of the United States the eighty-eighth.</p><p style=\"font-family:Georgia,serif;line-height:1.6\"><b>ABRAHAM LINCOLN</b><br>By the President: <b>WILLIAM H. SEWARD</b>, Secretary of State.</p>"+'</details>'
+'<div class="fbk" style="background:var(--sec);color:var(--ink);font-weight:400;line-height:1.5"><b>🔎 Read it like a historian</b><br>1. Who is the audience? 2. What reasons does Lincoln give for being thankful? 3. Which sentence mentions the war, and what does he ask people to pray for? 4. Why do you think he wrote that the gifts came from “the Most High God”, and who might not have agreed? 5. Whose voices from 1863 are not in this document?</div>'
+'<p class="mut">The wording above was matched to the American Presidency Project page (Proclamation 106), which is the source of record. I could only check spelling and punctuation, not capitalization, so please compare it with that page for any small differences. Other transcripts use modernized spelling (for example “theater” versus “theatre”).</p>'
+'<p><a href="https://www.presidency.ucsb.edu/documents/proclamation-106-thanksgiving-day-1863" target="_blank" rel="noopener"><b>Full text: The American Presidency Project, Proclamation 106 ↗</b></a><br><a href="https://teachingamericanhistory.org/document/proclamation-for-thanksgiving/" target="_blank" rel="noopener">Teaching American History transcript ↗</a><br><a href="https://obamawhitehouse.archives.gov/sites/default/files/docs/transcript_for_abraham_lincoln_thanksgiving_proclamation_1863.pdf" target="_blank" rel="noopener">White House Archives transcript (modernized spelling) ↗</a></p></div>'
+'<div class="panel"><h2>John F. Kennedy · Proclamation 3560, November 1963</h2><p class="mut">Thanksgiving Day, 1963. Source: The American Presidency Project (UC Santa Barbara), which lists it as issued November 5, 1963 and notes it was dated November 4.</p>'
+'<details open><summary><b>Read the full text</b></summary>'+"<p style=\"font-family:Georgia,serif;line-height:1.6\"><b>By the President of the United States of America</b></p><p style=\"font-family:Georgia,serif;line-height:1.6\"><b>A Proclamation</b></p><p style=\"font-family:Georgia,serif;line-height:1.6\">Over three centuries ago, our forefathers in Virginia and in Massachusetts, far from home in a lonely wilderness, set aside a time of thanksgiving. On the appointed day, they gave reverent thanks for their safety, for the health of their children, for the fertility of their fields, for the love which bound them together and for the faith which united them with their God.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">So too when the colonies achieved their independence, our first President in the first year of his first Administration proclaimed November 26, 1789, as \"a day of public thanksgiving and prayer to be observed by acknowledging with grateful hearts the many signal favors of Almighty God\" and called upon the people of the new republic to \"beseech Him to pardon our national and other transgressions... to promote the knowledge and practice of true religion and virtue . . . and generally to grant unto all mankind such a degree of temporal prosperity as He alone knows to be best.\"</p><p style=\"font-family:Georgia,serif;line-height:1.6\">And so too, in the midst of America's tragic civil war, President Lincoln proclaimed the last Thursday of November 1863 as a day to renew our gratitude for America's \"fruitful fields,\" for our \"national strength and vigor,\" and for all our \"singular deliverances and blessings.\"</p><p style=\"font-family:Georgia,serif;line-height:1.6\">Much time has passed since the first colonists came to rocky shores and dark forests of an unknown continent, much time since President Washington led a young people into the experience of nationhood, much time since President Lincoln saw the American nation through the ordeal of fraternal war--and in these years our population, our plenty and our power have all grown apace. Today we are a nation of nearly two hundred million souls, stretching from coast to coast, on into the Pacific and north toward the Arctic, a nation enjoying the fruits of an ever-expanding agriculture and industry and achieving standards of living unknown in previous history. We give our humble thanks for this.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">Yet, as our power has grown, so has our peril. Today we give our thanks, most of all, for the ideals of honor and faith we inherit from our forefathers--for the decency of purpose, steadfastness of resolve and strength of will, for the courage and the humility, which they possessed and which we must seek every day to emulate. As we express our gratitude, we must never forget that the highest appreciation is not to utter words but to live by them.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">Let us therefore proclaim our gratitude to Providence for manifold blessings--let us be humbly thankful for inherited ideals--and let us resolve to share those blessings and those ideals with our fellow human beings throughout the world.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">Now, Therefore, I, John F. Kennedy, President of the United States of America, in consonance with the joint resolution of the Congress approved December 26, 1941, 55 Stat. 862 (5 U.S.C. 87b), designating the fourth Thursday of November in each year as Thanksgiving Day, do hereby proclaim Thursday, November 28, 1963, as a day of national thanksgiving.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">On that day let us gather in sanctuaries dedicated to worship and in homes blessed by family affection to express our gratitude for the glorious gifts of God; and let us earnestly and humbly pray that He will continue to guide and sustain us in the great unfinished tasks of achieving peace, justice, and understanding among all men and nations and of ending misery and suffering wherever they exist.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">In Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.</p><p style=\"font-family:Georgia,serif;line-height:1.6\">DONE at the City of Washington this fourth day of November, in the year of our Lord nineteen hundred and sixty-three, and of the Independence of the United States of America the one hundred and eighty-eighth. [See APP Note.]</p><p style=\"font-family:Georgia,serif;line-height:1.6\"><b>JOHN F. KENNEDY</b><br>By the President:<br><b>DEAN RUSK</b>,<br>Secretary of State</p>"+'</details>'
+'<div class="fbk" style="background:var(--sec);color:var(--ink);font-weight:400;line-height:1.5"><b>🔎 Read it like a historian</b><br>1. Which earlier proclamations does Kennedy mention, and why? 2. What does he say grew along with the nation’s power? 3. What does he ask people to do besides giving thanks? 4. Which sentence is about actions, not words?</div>'
+'<div class="fbk" style="background:var(--sec);color:var(--ink);font-weight:400;line-height:1.5"><b>Why this one is poignant</b><br>President Kennedy was killed on November 22, 1963, six days before the Thanksgiving this proclamation set. That is a good reminder that a document can mean something different after later events.</div>'
+'<p class="mut">Text from the American Presidency Project (UC Santa Barbara). The bracketed “See APP Note” is theirs: it points to their note about the date.</p>'

+'<div class="panel"><h2>⚖️ Compare the two</h2><p>Both presidents point back to earlier days of thanks. Lincoln wrote during a civil war and asked people to remember the widows, orphans and mourners. Kennedy wrote during the Cold War, with the world worried about conflict. Which concerns do you see in each? What stays the same after 100 years?</p></div>'

var DEEPX={"What was Roosevelt Island once called?": "Roosevelt Island has had several names, and each one tells you something about how the city used it. In the 1700s and 1800s it was commonly known as Blackwell's Island, after a family that owned it. In the late 1820s the City of New York bought the island and began placing institutions there, such as a penitentiary, a hospital and an asylum. In 1921 it was renamed Welfare Island, a name tied to the public institutions on it. In 1973 it became Roosevelt Island, honoring President Franklin D. Roosevelt. When you study a place, look for the old names, because a change of name often marks a change in how people saw it.", "Why did Nellie Bly's reporting matter?": "Nellie Bly was a young reporter for Joseph Pulitzer's newspaper, the New York World. In 1887 she pretended to be mentally ill so that she could be admitted to the women's asylum on Blackwell's Island. She stayed about ten days and wrote about what she saw, including cold rooms, poor food and rough treatment by some staff. Her articles were later gathered in a book called Ten Days in a Mad-House. Her reports caused public outrage, and officials investigated and increased funding for patient care. She is remembered as a pioneer of investigative journalism, in which a reporter goes undercover to find the truth.", "Which came first?": "Long before the tram, the island was already a place where the city put its public institutions. In the 1800s these included a penitentiary (a prison), an almshouse for people living in poverty, and several hospitals. Many of the buildings were built of stone, and some of the work was done by people held in the prison. The island was far enough from the busy city that officials thought it was a good place for these institutions. The famous tram that carries riders over the East River did not open until 1976. The order of events helps us see how the island's purpose changed from institutions to a residential community.", "What is an almshouse?": "An almshouse was a place run by a town or city to shelter people who could not support themselves. Residents might be elderly, sick, disabled, orphaned or simply too poor to pay rent. Conditions in almshouses varied, but reformers often criticized them as crowded and harsh. The word comes from \"alms,\" an old word for gifts of money or food given to people in need. Blackwell's Island held a city almshouse in the 1800s, alongside other public institutions. Studying almshouses helps historians understand how cities in the past treated poverty, and how those ideas changed over time.", "Which institutions did the city build on the island in the 1800s?": "After buying the island in the late 1820s, New York City put several public institutions there. These included a penitentiary, an almshouse, a lunatic asylum and hospitals for the sick. Putting them on an island kept them apart from the crowded streets of the growing city, and it also kept the people inside out of sight. Visitors and reporters later wrote about what they saw, and some of their accounts led to calls for reform. Over the 1900s the institutions were closed or moved. Later the island was redeveloped as housing and parks, which is why it looks so different today.", "Which one is a Four Freedoms idea?": "The Four Freedoms come from a speech that President Franklin D. Roosevelt gave to Congress in January 1941. He named freedom of speech, freedom of worship, freedom from want and freedom from fear. The speech came while World War II was raging in Europe, before the United States entered the war. Artist Norman Rockwell later painted a famous set of four pictures inspired by the speech. On the southern tip of Roosevelt Island there is a park honoring the Four Freedoms, designed by architect Louis Kahn and opened in 2012. The park shows how a place can be renamed and reshaped to remember a big idea.", "Why is Nellie Bly’s reporting useful to historians?": "Bly's articles were written in 1887 by someone who was inside the asylum, so they are a primary source. A primary source comes from the time being studied, which makes it valuable for understanding what people saw and thought then. But a primary source is not automatically a perfect record. Bly was a newspaper reporter who wanted readers to be moved, so historians ask what she chose to include and what she left out. They also compare her account with other evidence, such as official reports and the investigation that followed. Good history comes from asking who wrote something, why, and how it matches other sources.", "Which big question does the island’s history ask?": "The question \"Whose experiences are remembered?\" is a reminder that history is not just a list of events. The island held patients, prisoners and poor residents whose stories were often not recorded by the people in charge. Names, plaques, parks and buildings all reflect choices about what a community wants to remember. When we look at a place, we can ask who is named, who is missing, and who decided. Asking this does not mean the past was all bad, but it helps us see the full picture. Historians look for the voices that are harder to find, and then try to include them.", "Blackwell’s Island is generally explained as being named for...": "The usual explanation is that the island was named for the Blackwell family, who owned it in the 1700s and early 1800s. That explanation is repeated in many places, but a careful historian still tries to trace it to the original deeds and records. Local histories sometimes repeat a story for so long that it seems certain without anyone checking. This is why our app asks you to confirm details with an official or archival source, such as the organization that runs the island today. Land records, maps and old newspapers can show who really owned a place and when. Noting what is well documented and what is just repeated is a key habit of good research.", "Two sources give different dates. What is the best next step?": "When two sources disagree, you should not just pick the one you like. A good first step is to find out where each source got its information. A primary or official source, such as a government record, a newspaper from the day, or a letter, is usually closer to the event. Next, look at who wrote each source and whether they had a reason to remember it differently. Then write down the disagreement and say which date you are using and why. Historians often include notes like \"sources differ on this point,\" because being honest about uncertainty makes research more trustworthy.", "Which pair is a primary source and a secondary source?": "A primary source was created during the time you are studying, like a diary, a photograph, a law, or Nellie Bly's 1887 articles. A secondary source is created later by someone who studied the evidence and explains it, like a modern history guide or textbook. Both are useful. Primary sources let you see the past directly, while secondary sources help you understand context and patterns. A source can even be both, depending on your question. For example, a 1950 history book is secondary about 1850 but primary if you are studying how people in 1950 thought about the past.", "What does asking whose experiences are remembered reveal?": "Public memory is shaped by choices. A statue, a street name or a park does not appear by accident. People decide what to honor, and those decisions can leave out groups who had less power at the time. For example, the island's patients and prisoners are less visible in public memory than the leaders who gave it a famous new name. Asking the question lets us see that history includes both what is remembered and what is forgotten. Communities sometimes later add new markers or stories to include voices that were missing. Good historians pay attention to both the monuments and the gaps.", "Was Central Park designed or left entirely wild?": "Central Park looks natural, but it is one of the most carefully designed landscapes in the country. In 1858 Frederick Law Olmsted and Calvert Vaux won a design competition with their plan, called the Greensward Plan. Workers blasted rock, moved huge amounts of earth, drained swampy areas, built lakes and planted a great many trees and shrubs. Paths, bridges and roads were arranged so that people could walk, ride and drive through changing views. The designers wanted a place where people of all backgrounds could escape the crowded city. So even the parts that feel wild were planned by people.", "What was Seneca Village?": "Seneca Village was a community that stood from about 1825 until the 1850s, in the area now inside the park between roughly 82nd and 89th Streets. It was one of the first communities of free Black property owners in New York, and it also included Irish and German immigrants. It had homes, churches and a school. In the 1850s the city took the land by eminent domain to build Central Park, and the residents were made to leave. Historians, archaeologists and the Central Park Conservancy have studied it using property records, census records and digs. It is a good example of how a public project can bring benefits to many while costing a few their homes.", "What can studying Central Park teach us?": "Central Park shows that big public projects can bring great benefits and also have costs. Millions of people use the park for rest, play, music and fresh air, and it helped inspire parks in other cities. At the same time, creating it meant taking land where people already lived, including the community of Seneca Village. A mature way to study a place is to look at both sides, rather than telling only a happy story. Historians ask who gained, who lost, and who got to decide. These questions help us think about fairness in the projects our cities build today.", "What does designed nature mean?": "Designed nature means a landscape that looks natural but was planned by people. In Central Park, designers shaped the hills, placed the ponds and planned where each tree would grow. Workers used gunpowder and hand tools to break rock and moved enormous amounts of soil. The goal was to create views that change as you walk, like scenes in a painting. Some parts were meant to look like open meadows, others like woodland. When you visit, look for clues such as curving paths, bridges that frame a view, and lakes with carefully shaped edges.", "What was in the area before the park?": "Before Central Park, the land held much more than empty fields. There were farms, small businesses, rocky pastures, swampy ground and the homes of many families. The village of Seneca Village stood on part of it, and other residents lived in shanties and small houses elsewhere. Some people kept pigs and goats, and others worked nearby. When the city decided to create the park in the 1850s, it took the land through eminent domain, which means a government can buy property for public use. Thinking about what was there before helps you see that a place's history did not begin when the park opened.", "What happened to Seneca Village residents?": "In 1853 the state allowed New York City to take land for the park, and the village land was acquired in the following years. Owners were paid, though many later said the payments were not enough, and renters had much less protection. By about 1857 the residents had been removed and the buildings torn down. The families scattered to other neighborhoods, and the community did not continue as one place. Few written accounts from villagers survive, so researchers use records and archaeological digs. Studying their story today helps the city remember people who were nearly forgotten.", "Which question fits the chapter’s big idea?": "The question \"Who benefits and who bears the costs?\" is useful for any public project, not just Central Park. A new park, road or building can help many people while making things harder for others. Asking this question makes us look for both the gains and the losses. It also reminds us to ask who was able to speak up, and who was not heard. Historians and city planners use it to judge fairness. You can ask it about your own neighborhood too.", "How can the park be understood today?": "Today Central Park is loved by millions of visitors and is also a place with a complicated history. Both of these things can be true at once. Knowing that Seneca Village once stood there does not mean the park is bad, but it adds a deeper layer to a place that many people think of as simply peaceful. A small marker and tours today remind visitors about the community. Understanding a place well means holding the good and the hard parts together. That is a good way to think about many places in history.", "Which research question is strongest?": "A strong research question points toward evidence and the people involved. \"Whose homes were lost, and how do we know?\" does both: it asks about real people and it asks what proof we have. Weak questions tend to be too vague, like \"Was it good?\", or have no way to be checked. A good question suggests where to look, such as land records, census data, maps, newspapers and archaeological finds. It also leaves room for surprises, because the answer is not decided in advance. Learning to write strong questions is one of the most useful skills a historian can have.", "Why do historians use property and census records for communities like Seneca Village?": "Many people in communities like Seneca Village did not leave diaries or letters that survive, but governments kept records about them. Property records show who owned land and how much it was worth. Census records list names, ages, jobs and where people were born. Church and school records can add more. Put together, these records help researchers rebuild who lived in a place and how they made a living. But the records have gaps, errors and biases, since officials decided what to count and how, so historians treat them with care.", "Which approach best respects existing residents when a city builds a park?": "A fair approach starts by talking with the people who will be affected, before decisions are final. It means offering fair payment, help finding new homes, and time to move. It also means respecting the community's history, for example by recording its stories. In the 1850s, many residents had little power in the process, and renters in particular had few protections. Modern laws and planning practices, though far from perfect, try to give residents more of a voice. Comparing past and present is a good way to see how ideas about fairness have changed.", "Which clue suggests a landscape feature was designed?": "Look for signs of planning. Curving paths that open onto a planned view, a lake with a carefully shaped shoreline, or trees arranged in a pattern all suggest someone made deliberate choices. Natural landscapes usually look less orderly, with irregular edges and mixed plants. Historians also check old plans, drawings and construction records to confirm what was designed. In Central Park, the Greensward Plan documents many of those choices. Putting what you see on the ground together with documents gives a more reliable answer than either alone.", "What is another name for Sixth Avenue?": "Sixth Avenue is also called the Avenue of the Americas, a name it received in 1945 under Mayor Fiorello La Guardia. The new name was meant to honor the nations of the Western Hemisphere. Even though the signs show both names, many New Yorkers still say Sixth Avenue. Along the street you can see banners with the flags of the American nations. Sixth Avenue is also where the Macy's parade marches in the later part of its route. Names that change but do not fully catch on are a sign of how people use places in real life.", "What opened in 1932 near Rockefeller Center?": "Radio City Music Hall opened in December 1932 as part of the Rockefeller Center complex. It was built during the Great Depression, when many people were out of work, and its construction provided jobs. The Art Deco theater was one of the largest in the world and is known for its giant stage. It is the home of the Rockettes, the famous dance troupe. The Rockettes often take part in the Macy's parade, performing a kick line. The Hall shows how a city can build big projects even in hard times.", "Why do many Manhattan streets form a grid?": "In 1811 a group called the Commissioners drew up a plan for the part of Manhattan that was not yet built up. They laid out a regular grid of numbered streets running east and west, crossing avenues running north and south. The plan covered most of the island north of what is now Houston Street. A grid made land easy to divide, sell and build on. Critics at the time and since have said it ignored hills, streams and the existing landscape. A famous exception is Broadway, an older route that cuts diagonally across the grid. Herald Square exists because of this crossing of Broadway and the avenues.", "What is a street grid?": "A street grid is a pattern of streets that cross each other at right angles, forming blocks. In Manhattan, avenues generally run north and south, and numbered streets run east and west. Higher street numbers are farther north, so 59th Street is north of 34th Street. The grid makes it easy to find your way. If you know the numbers, you can tell which direction to walk. Because Manhattan is tilted, the grid is not aligned exactly with north on a compass.", "Is Herald Square north or south of Central Park?": "Herald Square is south of Central Park. It sits around 34th Street, while the southern edge of Central Park is at 59th Street. That is roughly 25 blocks apart, and about a mile and a bit, depending on the path you take. In Manhattan, smaller street numbers are south and larger numbers are north. That is why the parade moves south from the Upper West Side to finish at Macy's. Learning this rule makes it much easier to read any Manhattan map.", "Why do organizers watch the wind between tall buildings?": "Tall buildings can act like walls that bend and speed up the wind. Streets lined with skyscrapers form what people call urban canyons, and air can be squeezed and forced down or along the street. This can cause sudden gusts that are stronger than the wind measured in an open area. For giant balloons, gusts are dangerous because wind force grows quickly as it gets faster. Police and parade officials monitor the wind along the route. Balloons may be flown lower or kept on the ground if conditions look unsafe.", "What is Avenue of the Americas?": "Avenue of the Americas is the official name added to Sixth Avenue in 1945. It is not a separate street, but the same road with two names. The name was chosen to honor the countries of the Americas, and you can see their flags on lampposts at times. Maps and street signs usually show both names, while locals mostly use the older one. If someone gives you directions using either name, they mean the same street. Knowing this can keep you from getting lost.", "What helps you find where you are on a street corner?": "In Manhattan, street signs show both the street name and the avenue, so any corner can be located exactly. For example, a corner might be \"34th Street and Sixth Avenue.\" Knowing the numbers tells you how far north or south you are, and which avenue tells you how far east or west. Signs also often show whether the street is one-way, and which direction it goes. Comparing the sign to a map lets you check your position. This kind of skill is called wayfinding.", "A map says schematic, not to scale. What should you conclude?": "A schematic map simplifies a place to show relationships, such as which stop comes after which, without keeping distances accurate. Subway maps are a well-known example. They are easy to read, but you should not use them to measure how far apart places are. If a map says it is not to scale, do not use a ruler on it. For exact distances, you need a map that gives a scale, such as a street map or an online map tool. Always read the notes on a map to know what it can and cannot tell you.", "Which source is best for this year’s parade route?": "For a current event like the parade, the best source is the official one, such as NYC or the NYC Department of Transportation, or the parade organizers. Routes and street closures can change from year to year, and sometimes at the last minute. News reports and blogs may be helpful but can repeat old information. Checking the date of any source is a basic habit of good research. For safety, it is best to check the official listing right before you go. That way, you know you are not following an outdated map.", "Which is an example of urban change on Sixth Avenue?": "Sixth Avenue has changed many times. In 1945 it gained the additional name Avenue of the Americas. Over the 1900s, the elevated train that once ran along it was removed, and large office buildings were built along the avenue. Today it is a major route for traffic and for the parade. Urban change includes new names, new buildings, new transportation and new uses for old spaces. Comparing old and new photos of the same corner is a good way to see this.", "Why follow barriers and official restrictions when watching a parade?": "A parade brings huge crowds and large moving objects, so planners manage the space to keep people safe. Barriers keep walkers away from balloons and floats and keep emergency vehicles able to get through. Rules about where you can stand, and what you can bring, are part of the safety plan. Police and officials may close streets and change the plan if the weather is bad. Following the rules helps everyone enjoy the event. It also shows how much planning is needed for a public event.", "In what year did the parade begin?": "The Macy's parade began in 1924. It was first held in the morning of Thanksgiving Day and was promoted as a Christmas parade, ending with Santa Claus arriving at the store. Many of the early marchers were Macy's employees, and live animals from the Central Park Zoo were part of it. The route went from upper Manhattan down to the Herald Square store. Giant balloons were added in the late 1920s. The parade has grown into one of the most famous holiday events in the country.", "Why did the parade stop from 1942 through 1944?": "The parade was paused during World War II. Rubber and other materials were needed for the war effort, and the balloons used these materials. Macy's is reported to have donated its rubber balloons to the war effort. Many families were also affected by the war, and the country's focus was elsewhere. The parade returned in 1945 after a break of three years. This is an example of how big world events can change even a fun tradition.", "What makes a helium balloon rise?": "A helium balloon rises because of buoyancy. The balloon pushes aside a volume of air, and the surrounding air pushes up on it with a force equal to the weight of that displaced air. Helium is much lighter than air, so the balloon plus its gas weighs less than the air it displaces. When the push up is greater than the weight pulling down, the balloon rises. If you add enough weight, like ropes or a heavy skin, it can stop rising. This idea is called Archimedes' principle.", "Why does a helium balloon rise?": "Helium is less dense than air, which means a given amount of helium weighs less than the same amount of air. A balloon filled with helium displaces air, and the air pushes up on it. Because the helium inside weighs so little, the upward push is stronger than the downward pull of gravity. About one cubic meter of helium can lift roughly one kilogram, though the exact number varies with temperature. Hydrogen is even lighter, but it can catch fire, so helium is used at parades. The skin and the ropes also add weight.", "What does inflatable mean?": "An inflatable is an object that holds its shape because it is filled with gas, usually air or helium. The word comes from \"inflate,\" which means to fill with air. Parade balloons are inflatables, but so are bouncy castles and life rafts. The outer material needs to be strong and light, and it must hold the gas without leaking. Designers also use inner supports and ropes to control the shape. When an inflatable loses gas, it becomes limp, and that is called deflating.", "What happened to the early practice of releasing balloons after the event?": "In the late 1920s, the balloons were not saved. At the end of the parade, they were released into the sky, and a prize was offered to anyone who returned them. This practice reportedly ended after an unsafe incident with an airplane in 1932. After that, the balloons were deflated and reused instead. This is the account our app follows, but the details are one of the facts we list as needing a double-check. Planners kept learning from problems like this and added new rules. It shows how safety rules often come from real events.", "In the balloon lab, when does a balloon rise?": "In the balloon lab, a balloon rises when its lift is greater than its total weight. Lift comes from the helium, and weight includes the skin, the ropes and anything attached. If the two are equal, the balloon hovers. If weight is greater, it sinks. The difference between them is called the net force. A bigger balloon holds more helium and gets more lift, but it may also need more material, which adds weight.", "Why might a balloon stay home on a windy day?": "Strong wind can make a giant balloon hard to control. The balloon acts like a big sail, and wind pushes on it harder as the wind speed rises. Because the force depends on the square of the wind speed, doubling the wind makes the push about four times as strong. In New York, balloons are grounded if sustained winds are above 23 mph or gusts are above 34 mph, according to reports. These limits came after an accident in 1997 in which a balloon hit a lamp post. Organizers decide based on measurements from police on the route.", "Sources differ on the helium date. What is best practice?": "Some sources say helium was first used in the parade in 1928, while others give different details. When sources disagree, the best practice is to name the source you follow, such as Macy's own history, and say that others differ. That way your readers can check for themselves. It is also worth looking for a primary source, such as a newspaper from the time. Being open about uncertainty makes your work more trustworthy than pretending the question is settled. Our app follows Macy's account and says so.", "Which is a primary source about the 1924 parade?": "A 1924 newspaper article or an advertisement from the time is a primary source because it was created when the parade happened. Primary sources can show what people reported or wanted the public to think. A modern history of the parade is a secondary source, because it is written later. Both are useful, but only the first lets you see the 1924 point of view directly. Archives, libraries and museums often have digitized newspapers and photos. Checking more than one primary source helps you catch mistakes.", "Why can a map not prove the 1924 route?": "A map shows streets and places, but it does not tell you which of them an event used. To prove a parade route, you need evidence from the event itself, such as newspaper stories, advertisements, programs or photographs. A modern line drawn on a map may connect known start and finish points but may not match the exact turns. That is why our app labels some route lines as illustrative. Maps are very useful for context, but they work best alongside other sources. Putting different kinds of evidence together is what historians do.", "Why can a bigger balloon fail to rise more?": "A bigger balloon holds more helium and so gets more lift, but it also needs more skin, ropes and attachments. All of that adds weight. If the extra weight grows as fast as the extra lift, the balloon may not rise any higher. Volume grows faster than surface area as a balloon gets bigger, which helps big balloons, but design still has limits. Engineers try to use the lightest strong material. The net lift, meaning lift minus weight, is what decides if a balloon rises.", "Which president proclaimed a national Thanksgiving in 1863?": "President Abraham Lincoln issued a proclamation in October 1863 asking Americans to observe a day of thanksgiving on the last Thursday of November. It came in the middle of the Civil War, after major battles. Writer Sarah Josepha Hale had campaigned for years for a national Thanksgiving day. Earlier presidents, including George Washington, had called for days of thanks, but these were one-time events. Lincoln's proclamation helped make Thanksgiving an annual national tradition. In 1941 Congress set the date as the fourth Thursday of November.", "Did harvest and gratitude traditions begin with the English colonists?": "No. Indigenous peoples across North America had practiced thanksgiving, harvest celebrations and ceremonies of gratitude for many centuries. The Wampanoag, whose homeland included the area around Plymouth, had their own traditions of giving thanks. The 1621 gathering at Plymouth was one meal among many harvest traditions. In New York, the Lenape lived in the region long before European settlers arrived. Learning this helps us avoid telling only one part of the story. Native communities continue many of these traditions today.", "Why should we study more than one account of 1621?": "Only a few written accounts of the 1621 gathering at Plymouth survive, and most were written by English colonists. One is a letter by Edward Winslow. These accounts say that colonists and Wampanoag people shared food over several days, but they leave out many details. Wampanoag oral history and the knowledge of their descendants add important perspectives. Comparing sources helps us see what each one includes and leaves out. A fuller history also looks at what happened to Native communities in the years after 1621.", "Which is a primary source about Thanksgiving in 1863?": "Lincoln's proclamation is a primary source because it was written at the time. You can read it today through archives such as the National Archives and the Library of Congress. Reading it directly lets you see his words, his reasons and the tone he used. Still, a primary source needs interpretation, since it shows only what its author wanted to say. Historians read it alongside letters, newspapers and records of the war. A proclamation tells you what a leader announced, not necessarily how everyone felt.", "Why do some people examine the traditional 1621 story critically?": "The traditional story often shows a peaceful meal between colonists and Wampanoag people and then stops. That leaves out the longer history, including disease that had devastated Native communities before the Mayflower arrived, and later conflict and loss of land. Many Wampanoag people and others today observe a National Day of Mourning on Thanksgiving Day to remember this. Examining the story critically does not mean erasing it, but adding more information. It also means asking who told the story and for what purpose. A fuller account includes both the meal and the longer history.", "Which question helps you find missing voices?": "Asking \"Whose perspective is not in this source?\" helps you notice who has been left out. Many older records were written by people with power, such as officials, merchants and colonists. Others, such as Native peoples, enslaved people or women, may appear less, or only through someone else's eyes. Once you notice a gap, you can look for other sources, like oral histories, archaeology or art. It is a habit that works on any source, from a textbook to a social media post. It makes you a more careful reader.", "What was the 1924 Macy’s parade themed around?": "The 1924 parade was themed around Christmas. It was held on Thanksgiving morning and ended with Santa Claus arriving at Macy's Herald Square, a sign that the holiday shopping season had begun. For several years it was known as the Macy's Christmas Parade. Macy's has used the parade to promote its store, and it later became a Thanksgiving tradition in its own right. The link between Thanksgiving and the start of the holiday season is partly due to this. This mix of history and marketing is a good thing to notice.", "How have Thanksgiving traditions changed?": "Thanksgiving has changed a great deal over time. The 1621 gathering was a harvest meal that was not called Thanksgiving at the time. Many places held days of thanks in the colonial period, and Lincoln made it a national holiday in 1863. Football, parades and turkey became common parts of the day over the 1800s and 1900s. Families add their own foods and customs, and some people include time to remember Native history. Traditions are not fixed. They are shaped by each generation.", "In which year did the Mayflower arrive at Plymouth?": "The Mayflower sighted Cape Cod in November 1620 and the passengers settled at Plymouth in December of that year. About 100 people were aboard, including families and others hired to work, and they were not all Pilgrims. The Mayflower Compact, an agreement about governing themselves, was signed while the ship was anchored near Cape Cod. The first winter was very hard, and about half of the settlers died. The 1621 gathering took place the following autumn. The Wampanoag people had lived in the area for thousands of years.", "Why do archives such as the National Archives matter?": "Archives keep original records, like letters, laws, maps and photographs, so that people in the future can study them. Without archives, we would depend on retellings that might have errors. Archives also let anyone check what historians claim. The National Archives holds presidential and government records, and much of it is now online. Many archives show how records were organized and where they came from. Using an archive is a good way to practice finding primary sources.", "How can families honor multiple histories at Thanksgiving?": "Families can share what they are thankful for and also learn about Native perspectives on the holiday. Reading books by Native authors, visiting museums such as the National Museum of the American Indian, or learning about the local Native community are ways to start. Some families also observe the National Day of Mourning or acknowledge whose land they are on. These actions do not take away from gratitude, but add to it. People may do this in different ways depending on their beliefs. The key is to keep learning.", "What is the Lenape connection to NYC?": "The Lenape are Indigenous peoples whose homeland included the area that became New York City, parts of New Jersey, and nearby regions. Their name for the area is often given as Lenapehoking. The name Manhattan is generally thought to come from a Lenape-related word, although scholars discuss its exact meaning. Many Lenape were pushed out as Dutch and English colonists arrived, and others moved far away. Lenape descendants still live today, many in places such as Oklahoma, Wisconsin and Ontario. Learning about them reminds us that the city has a much longer history than its streets suggest."};
